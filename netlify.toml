[
build
]
  command = "npm run build"
  publish = "dist"

[[
redirects
]]
  from = "/*"
  to = "/index.html"
  status = 200

[[
headers
]]
  for = "*.js"  
 [
headers.values
]
    Content-Type = "application/javascript; charset=utf-8"

[[
headers
]]
  for = "*.wasm"
  [
headers.values
]
    Content-Type = "application/wasm"

[[
headers
]]
  for = "*.svg"
  [
headers.values
]
    Content-Type = "image/svg+xml"

[[
edge_functions
]]
path = "/proxy/*"
function = "proxy"
